# The suite on every operating system pb builds for: the store and
# the export are witnessed where they run, what a platform cannot
# mount skipping as the suite says.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The acceptance arms enter a user namespace; Ubuntu 24.04
      # restricts unprivileged ones through AppArmor for unconfined
      # programs. A host without the knob has no such restriction.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: go vet ./...
      - run: go test -cover ./... -count=1 -timeout=30m
