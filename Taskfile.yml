version: "3"

tasks:
  default:
    desc: Print this help message
    cmd: go-task --list
    silent: true

  test:
    desc: Run tests
    cmd: go test -cover ./...
    silent: true

  mutate:
    desc: Mutation-test the working-tree delta (oracle scratch bracketed)
    cmds:
      - mkdir -p .scratch/layer
      - >-
        gomutant run --changed HEAD --timeout 0
        --bracket-path .scratch/layer
